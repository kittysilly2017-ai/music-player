<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="player">

    <h2 id="heading">FOLDERS</h2>

    <button id="back" hidden>← BACK</button>

    <div id="folders" class="folders"></div>

    <div id="playlist" hidden>

        <h3 id="playlistTitle"></h3>

        <div id="songs"></div>

        <button id="addSongs">＋ ADD SONGS</button>

        <input
            id="songInput"
            type="file"
            accept=".mp3,audio/mpeg"
            multiple
            hidden
        >

    </div>

    <div class="import">

        <button id="importFolder">＋ IMPORT FOLDER</button>

        <input
            id="folderInput"
            type="file"
            webkitdirectory
            directory
            multiple
            hidden
        >

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
